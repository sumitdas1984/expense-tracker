[project]
name = "report-service"
version = "0.1.0"
description = "Expense reporting service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_service"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
