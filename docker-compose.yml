services:
  expense-service:
    build: ./expense-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://expense_user:local_dev_password@postgres:5432/expense_db
    volumes:
      - expense_data:/app/data
    depends_on:
    - postgres

  category-service:
    build: ./category-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg://expense_user:local_dev_password@postgres:5432/category_db
    volumes:
      - category_data:/app/data
    depends_on:
      - postgres

  report-service:
    build: ./report-service
    ports:
      - "8003:8003"
    environment:
      EXPENSE_SERVICE_URL: http://expense-service:8001
      CATEGORY_SERVICE_URL: http://category-service:8002
    depends_on:
      - expense-service
      - category-service

  ui-service:
    build: ./ui-service
    ports:
      - "8501:8501"
    environment:
      EXPENSE_SERVICE_URL: http://expense-service:8001
      CATEGORY_SERVICE_URL: http://category-service:8002
      REPORT_SERVICE_URL: http://report-service:8003
    depends_on:
      - expense-service
      - category-service
      - report-service

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: expense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  expense_data:
  category_data:
  postgres_data: