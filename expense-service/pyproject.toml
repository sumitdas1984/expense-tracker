[project]
name = "expense-service"
version = "0.1.0"
description = "Expense tracking service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
